[project]
name = "mcp-server"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uvicorn (>=0.40.0,<0.41.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "requests (>=2.32.5,<3.0.0)",
    "google-cloud-secret-manager (>=2.26.0,<3.0.0)",
    "google-cloud-pubsub (>=2.34.0,<3.0.0)",
    "google-api-python-client (>=2.188.0,<3.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "google-auth (>=2.49.1,<3.0.0)",
    "google-auth-httplib2 (>=0.3.1,<0.4.0)",
    "google-auth-oauthlib (>=1.3.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "mcp_server", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
